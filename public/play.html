<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13212B">
<title>Fence</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/play.css">
</head>
<body>
<section id="join">
  <div class="shutter jshutter"><div class="num">FENCE</div><div class="handle"></div><div class="lock"></div></div>
  <form id="jform" autocomplete="off">
    <label>Room code<input id="jcode" maxlength="4" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required></label>
    <label>Your name<input id="jname" maxlength="14" placeholder="Arun" required></label>
    <button class="btn primary big" type="submit">Join the game</button>
    <p id="jerr" class="err" role="alert"></p>
  </form>
  <p class="muted small center">The code is on the TV.</p>
</section>
<section id="app" hidden>
  <header id="hud"></header>
  <main id="main"></main>
  <nav id="tabs">
    <button id="tBag">Bag <span id="bagN"></span></button>
    <button id="tSecret">Secret</button>
  </nav>
</section>
<div id="sheetWrap" hidden><div class="scrim"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="sigflash"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/play.js"></script>
</body>
</html>
