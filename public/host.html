<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fence: TV</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/host.css">
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="app">
  <header id="top"></header>
  <main id="stage"></main>
  <footer id="dock"></footer>
</div>
<div id="controls">
  <button id="bVoice" title="Narrator voice">Voice on</button>
  <button id="bSound" title="Sound effects">Sound on</button>
  <button id="bSkip" title="Skip this screen (space bar)">Skip</button>
  <button id="bFull" title="Full screen">Full screen</button>
</div>
<div id="gate">
  <div class="gate-in">
    <div class="sign gate-logo">FENCE</div>
    <p>A one-night heist game set in the godowns of Kochi. This screen is the TV. Everyone else plays on their phone.</p>
    <button id="bOpen" class="sign">Open the godowns</button>
    <p class="muted small">Best on a TV or laptop. Turn the volume up: there is a narrator.</p>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/host.js"></script>
</body>
</html>
